name: Book Store Login tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install through mirror
        run: |
          python -m pip install --timeout 10 --retries 1 --index-url https://pypi-mirror.gitverse.ru/simple/ -r requirements.txt || python -m pip install --timeout 30 --retries 1 --index-url https://pypi.org/simple/ -r requirements.txt
      - name: Unit with branch coverage
        run: python -m pytest tests/unit --cov=app --cov-branch --cov-report=xml:artifacts/coverage.xml --junitxml=artifacts/unit.xml --alluredir=allure-results
      - name: API
        run: python -m pytest tests/api --junitxml=artifacts/api.xml --alluredir=allure-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-api-results
          path: |
            artifacts/
            allure-results/
  ui-bdd:
    needs: unit-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install through mirror
        run: |
          python -m pip install --timeout 10 --retries 1 --index-url https://pypi-mirror.gitverse.ru/simple/ -r requirements.txt || python -m pip install --timeout 30 --retries 1 --index-url https://pypi.org/simple/ -r requirements.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: UI and CSV
        run: python -m pytest tests/ui --browser=${{ matrix.browser }} --junitxml=artifacts/ui.xml --alluredir=allure-results
      - name: BDD
        env:
          BDD_BROWSER: ${{ matrix.browser }}
        run: python -m behave -f pretty -o - -f allure_behave.formatter:AllureFormatter -o allure-results features
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-${{ matrix.browser }}
          path: |
            artifacts/
            allure-results/
